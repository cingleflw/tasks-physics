<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест с конструктором</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./api.js"></script>
    <script src="./main.js"></script>
</head>
<body>
<h1>Тест по физике с конструктором наборов задач</h1>

<!-- Выбор тем и количества задач. На время теста main.js прячет этот блок (hidden) -->
<div id="setup">
    <h2>Выберите одну или несколько тем:</h2>

    <!-- Заголовки классов и галочки тем добавляет main.js: список тем он получает с сервера -->
    <div id="topics">Загрузка списка тем…</div>

    <!-- min и max ограничивают только стрелки поля: вручную можно ввести и другое число,
         поэтому main.js проверяет его еще раз.
         Кнопка выключена (disabled), пока не загрузится список тем: ее включает main.js -->
    <p>
        <label>Количество задач: <input type="number" id="task-count" min="1" max="100" value="10"></label>
        <button id="start-test" disabled>Начать тест</button>
    </p>
</div>

<!-- Тест: задачи с полями для ответов, а после проверки — итоги.
     Пока тест не начался, блок спрятан (hidden). Задачи в список task-list добавляет main.js -->
<div id="test" hidden>
    <h2>Тест</h2>
    <p>Введите ответы числами, например 2,5, и нажмите «Завершить тест» внизу страницы.</p>

    <ol id="task-list"></ol>

    <!-- Сообщение о неверно введенных ответах или о том, что тест прерван -->
    <p id="test-message"></p>
    <button id="finish-test">Завершить тест</button>

    <!-- Итоги: количество правильных ответов, ошибок и затраченное время -->
    <div id="results"></div>
    <!-- Кнопка «Новый тест» появляется после итогов (или когда тест прерван) и возвращает к выбору тем -->
    <button id="new-test" hidden>Новый тест</button>
</div>

<p><a href="./constructor.html">Конструктор: добавить тему или задачу</a></p>
</body>
</html>
